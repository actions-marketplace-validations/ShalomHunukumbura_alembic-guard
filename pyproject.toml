[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alembic-guard"
version = "0.1.1"
description = "Catch Alembic migrations that lock tables or break running code before they reach production."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Shalom Hunukumbura" }]
keywords = ["alembic", "postgresql", "migrations", "linter", "sqlalchemy", "zero-downtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/ShalomHunukumbura/alembic-guard"
Issues = "https://github.com/ShalomHunukumbura/alembic-guard/issues"

[project.scripts]
alembic-guard = "alembic_guard.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/alembic_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
